spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  security:
    user:
      name: admin
      password: secret123

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiry-ms: ${JWT_ACCESS_EXPIRATION}
  refresh-token:
    expiry-ms: ${JWT_REFRESH_EXPIRATION}

server:
  port: ${SERVER_PORT}
